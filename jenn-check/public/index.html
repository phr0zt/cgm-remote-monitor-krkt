<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jenn — today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16222C; --panel:#1F2F3B; --panel2:#26394A; --line:#334A5C;
    --ink:#EEE9DF; --dim:#A7B4BE; --ok:#8FC49A; --wait:#E3AE5E; --red:#E9604F; --blue:#7FB3E0;
    --r:18px;
    font-family:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.35}
  body{max-width:560px;margin:0 auto;padding:16px 16px 48px}

  /* glucose ribbon */
  .glucose{display:flex;align-items:baseline;gap:14px;padding:6px 4px 18px}
  .glucose .num{font-size:56px;font-weight:700;letter-spacing:-1px;line-height:1}
  .glucose .arrow{font-size:34px;font-weight:700}
  .glucose .meta{color:var(--dim);font-size:16px}
  .glucose.high .num{color:var(--red)} .glucose.low .num{color:var(--blue)} .glucose.ok .num{color:var(--ok)}
  .glucose.stale .num{color:var(--dim)}
  .date{color:var(--dim);margin:0 0 14px 4px}

  /* buttons */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{appearance:none;border:0;border-radius:var(--r);background:var(--panel2);color:var(--ink);
       font:inherit;font-size:22px;font-weight:700;padding:26px 14px;min-height:96px;cursor:pointer;
       display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;
       border-bottom:4px solid var(--line)}
  .btn small{font-weight:400;font-size:15px;color:var(--dim)}
  .btn:active{transform:translateY(2px);border-bottom-width:2px}
  .btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .btn.wide{grid-column:1/-1;min-height:72px;padding:20px 14px}

  /* checklist */
  h2{font-size:17px;font-weight:400;color:var(--dim);margin:28px 4px 8px}
  .check{list-style:none;margin:0;padding:0;background:var(--panel);border-radius:var(--r);overflow:hidden}
  .check li{display:flex;align-items:center;gap:14px;padding:16px 18px;border-top:1px solid var(--line)}
  .check li:first-child{border-top:0}
  .mark{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:700;font-size:18px}
  .done .mark{background:var(--ok);color:#12281A}
  .todo .mark{border:3px solid var(--wait);color:var(--wait)}
  .check .lbl{flex:1}
  .check .det{color:var(--dim);font-size:16px}
  .done .det{color:var(--ok)}
  .todo .det{color:var(--wait)}
  .late .mark{border-color:var(--red);color:var(--red)} .late .det{color:var(--red)}

  /* log */
  .log{list-style:none;margin:0;padding:0 4px}
  .log li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:17px}
  .log .t{color:var(--dim);flex:0 0 78px;font-variant-numeric:tabular-nums}
  .log .src{color:var(--dim);font-size:14px;margin-left:auto;align-self:center}
  .empty{color:var(--dim);padding:14px 4px}

  /* popup */
  .veil{position:fixed;inset:0;background:rgba(10,18,24,.7);display:none;align-items:flex-end;justify-content:center;z-index:9}
  .veil.open{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:560px;border-radius:var(--r) var(--r) 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
  .sheet h3{margin:0 0 10px;font-size:20px}
  .val{font-size:44px;font-weight:700;text-align:center;padding:6px;min-height:64px;letter-spacing:-1px}
  .val .u{font-size:22px;color:var(--dim);font-weight:400;margin-left:4px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 12px}
  .pad button{font:inherit;font-size:26px;font-weight:700;padding:16px 0;border:0;border-radius:14px;background:var(--panel2);color:var(--ink);cursor:pointer}
  .pad button.soft{background:transparent;border:2px solid var(--line);color:var(--dim);font-size:20px}
  .row{display:flex;gap:10px}
  .row button{flex:1;font:inherit;font-size:20px;font-weight:700;padding:16px;border:0;border-radius:14px;cursor:pointer}
  .cancel{background:transparent;color:var(--dim);border:2px solid var(--line)!important}
  .ok{background:var(--ok);color:#12281A}
  textarea{width:100%;font:inherit;font-size:19px;background:var(--panel2);color:var(--ink);border:0;border-radius:14px;padding:14px;min-height:110px;margin-bottom:12px;resize:vertical}
  footer{margin-top:40px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}
  footer a{color:var(--blue);text-decoration:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#12281A;padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .toast.err{background:var(--red);color:#fff}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="glucose stale" id="glucose">
  <span class="num" id="gnum">—</span>
  <span class="arrow" id="garrow"></span>
  <span class="meta" id="gmeta">loading</span>
</div>
<p class="date" id="date"></p>

<div class="grid">
  <button class="btn" data-kind="basaglar">Basaglar<small>long-acting</small></button>
  <button class="btn" data-kind="apidra">Apidra<small>with food</small></button>
  <button class="btn" data-kind="carbs">Food<small>carbs in grams</small></button>
  <button class="btn" data-kind="bg">Finger prick<small>blood test, mmol/L</small></button>
  <button class="btn wide" data-kind="note">Note<small>anything else</small></button>
</div>

<h2 id="h-check">Today</h2>
<ul class="check" id="check"></ul>

<h2>Log</h2>
<ul class="log" id="log"></ul>

<footer>
  T1D Information : <a href="https://t1de.krkt.shop">T1DE.KRKT.SHOP</a><br>
  FOR MY KRKT, MY HUNNY&lt;3 PHR0ZT
</footer>

<div class="veil" id="veil">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const LABEL = { basaglar:"Basaglar", apidra:"Apidra", carbs:"Food", bg:"Finger prick", note:"Note" };
const UNIT  = { basaglar:"u", apidra:"u", carbs:"g", bg:"mmol/L" };
const ARROW = { DoubleUp:"⇈", SingleUp:"↑", FortyFiveUp:"↗", Flat:"→", FortyFiveDown:"↘", SingleDown:"↓", DoubleDown:"⇊" };
let defaults = { basaglar: 25 };

async function load(){
  try{
    const d = await (await fetch("/api/today",{cache:"no-store"})).json();
    if(d.error) throw new Error(d.error);
    defaults = d.defaults || defaults;
    $("#date").textContent = d.date;

    const g = d.glucose, el = $("#glucose");
    el.className = "glucose";
    if(!g){ el.classList.add("stale"); $("#gnum").textContent="—"; $("#gmeta").textContent="no reading"; }
    else{
      $("#gnum").textContent = g.mmol.toFixed(1);
      $("#garrow").textContent = ARROW[g.direction] || "";
      $("#gmeta").textContent = (g.delta!=null?(g.delta>0?"+":"")+g.delta.toFixed(1)+" · ":"") + (g.ageMin<=1?"just now":g.ageMin+" min ago");
      if(g.ageMin>15) el.classList.add("stale");
      else el.classList.add(g.mmol>=10?"high":g.mmol<4?"low":"ok");
    }

    const allDone = d.checklist.every(c=>c.done);
    $("#h-check").textContent = allDone ? "Today — all done" : "Today";
    $("#check").innerHTML = d.checklist.map(c=>`
      <li class="${c.done?"done":(c.late?"todo late":"todo")}">
        <span class="mark">${c.done?"✓":""}</span>
        <span class="lbl">${c.label}</span>
        <span class="det">${c.detail}</span>
      </li>`).join("");

    $("#log").innerHTML = d.items.length ? d.items.map(i=>`
      <li><span class="t">${i.time}</span>
          <span>${i.label}${i.value!=null?" "+i.value+i.unit:""}${i.note?" — "+esc(i.note):""}</span>
          <span class="src">${i.source==="page"?"":i.source}</span></li>`).join("")
      : `<li class="empty">Nothing logged yet today.</li>`;
  }catch(e){ toast("Can't reach Nightscout: "+e.message, true); }
}
function esc(s){ return s.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

// ----- popup -----
let kind=null, val="";
document.querySelectorAll(".btn").forEach(b=>b.addEventListener("click",()=>open(b.dataset.kind)));
function open(k){
  kind=k;
  if(k==="note"){
    $("#sheet").innerHTML = `<h3>Note</h3><textarea id="note" placeholder="e.g. walked 20 min, felt dizzy, skipped lunch"></textarea>
      <div class="row"><button class="cancel" onclick="close()">Cancel</button><button class="ok" onclick="saveNote()">OK</button></div>`;
    $("#veil").classList.add("open"); $("#note").focus(); return;
  }
  val = k==="basaglar" ? String(defaults.basaglar) : "";
  $("#sheet").innerHTML = `<h3>${k==="bg" ? "Finger prick — reading?" : LABEL[k]+" — how much?"}</h3>
    <div class="val"><span id="v"></span><span class="u">${UNIT[k]}</span></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join("")}
      <button class="soft" onclick="key('.')">.</button><button onclick="key('0')">0</button><button class="soft" onclick="key('⌫')">⌫</button></div>
    <div class="row"><button class="cancel" onclick="close()">Cancel</button><button class="ok" onclick="save()">OK</button></div>`;
  render(); $("#veil").classList.add("open");
}
function key(c){
  if(c==="⌫") val=val.slice(0,-1);
  else if(c==="." && val.includes(".")) return;
  else if(val.length<5) val+=c;
  render();
}
function render(){ $("#v").textContent = val || "0"; }
function close(){ $("#veil").classList.remove("open"); }
$("#veil").addEventListener("click",e=>{ if(e.target.id==="veil") close(); });

async function save(){
  const n=Number(val); if(!(n>0)) return toast("Enter a number above 0", true);
  await post({kind, value:n});
}
async function saveNote(){
  const t=$("#note").value.trim(); if(!t) return toast("Write something first", true);
  await post({kind:"note", note:t});
}
async function post(body){
  try{
    const r = await fetch("/api/treat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j = await r.json(); if(j.error) throw new Error(j.error);
    close(); toast(`${LABEL[body.kind]} saved`); load();
  }catch(e){ toast("Not saved: "+e.message, true); }
}
let tt; function toast(m,err){ const t=$("#toast"); t.textContent=m; t.className="toast show"+(err?" err":""); clearTimeout(tt); tt=setTimeout(()=>t.className="toast",2600); }

load(); setInterval(load, 60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
