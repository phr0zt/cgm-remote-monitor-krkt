<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jenn — today</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jenn">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#000000; --ink:#0B0B0C; --bone:#F1EDE6; --magenta:#D8347A; --crimson:#A5122C;
    --hair:rgba(241,237,230,.16); --dim:rgba(241,237,230,.55); --faint:rgba(241,237,230,.06);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0;background:var(--void);color:var(--bone);font-size:18px;line-height:1.4;-webkit-font-smoothing:antialiased}
  body{max-width:560px;margin:0 auto;padding:18px 18px 56px;min-height:100%;
       background:var(--void) radial-gradient(120% 60% at 50% 115%, var(--crimson), transparent 62%) no-repeat}
  .cap{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--dim);font-weight:400}

  /* glucose */
  .glucose{display:flex;align-items:baseline;gap:14px;padding:4px 0 10px;border-bottom:1px solid var(--hair);margin-bottom:12px}
  .glucose .num{font-size:64px;font-weight:200;letter-spacing:-.02em;line-height:1}
  .glucose .arrow{font-size:30px;font-weight:200}
  .glucose .meta{color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.12em}
  .glucose.high .num,.glucose.low .num{color:var(--magenta)} .glucose.ok .num{color:var(--bone)} .glucose.stale .num{color:var(--dim)}
  .date{color:var(--dim);margin:0 0 14px;text-transform:uppercase;letter-spacing:.14em;font-size:11px}

  .strip{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
  .chip{border:1px solid var(--hair);border-radius:70px;padding:7px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
  .chip b{color:var(--bone);font-weight:800;margin-left:4px} .chip.good b{color:var(--bone)} .chip.bad b{color:var(--magenta)}

  /* buttons — pill, bone hairline, magenta on press */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{appearance:none;background:transparent;color:var(--bone);border:1px solid var(--bone);border-radius:70px;
       font:inherit;padding:24px 18px;min-height:92px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;
       transition:border-color .2s,color .2s,background .2s}
  .btn .t{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
  .btn small{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em}
  .btn:active,.btn:hover{border-color:var(--magenta);color:var(--magenta);background:var(--faint)}
  .btn:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}

  h2{font-size:11px;font-weight:400;color:var(--dim);text-transform:uppercase;letter-spacing:.14em;margin:28px 0 10px}

  /* checklist */
  .check{list-style:none;margin:0;padding:0;background:var(--ink);border:1px solid var(--hair);border-radius:8px;overflow:hidden}
  .check li{display:flex;align-items:center;gap:14px;padding:16px 18px;border-top:1px solid var(--hair)}
  .check li:first-child{border-top:0}
  .mark{width:28px;height:28px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:16px;border:1px solid var(--hair)}
  .done .mark{background:var(--bone);color:var(--void);border-color:var(--bone)}
  .todo .mark{color:var(--dim)}
  .check .lbl{flex:1;font-size:16px}
  .check .det{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
  .done .det{color:var(--bone)}
  .late .mark{border-color:var(--magenta);color:var(--magenta)} .late .det{color:var(--magenta);font-weight:800}
  .prompt .mark{border-color:var(--magenta);color:var(--magenta)} .prompt .det{color:var(--magenta);font-weight:800}

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{background:var(--ink);border:1px solid var(--hair);border-radius:8px;padding:14px 10px;text-align:center}
  .tile .n{font-size:30px;font-weight:200;letter-spacing:-.02em;line-height:1.1}
  .tile .l{font-size:10px;color:var(--dim);margin-top:6px;text-transform:uppercase;letter-spacing:.12em}

  /* log */
  .log{list-style:none;margin:0;padding:0}
  .log li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--hair);font-size:15px;opacity:.85}
  .log .t{color:var(--dim);flex:0 0 78px;font-variant-numeric:tabular-nums;font-size:13px}
  .log .src{color:var(--dim);font-size:10px;margin-left:auto;align-self:center;text-transform:uppercase;letter-spacing:.1em}
  .empty{color:var(--dim);padding:14px 0;font-size:14px}

  /* popup */
  .veil{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;justify-content:center;z-index:9}
  .veil.open{display:flex}
  .sheet{background:var(--ink);width:100%;max-width:560px;border:1px solid var(--hair);border-bottom:0;border-radius:8px 8px 0 0;
         padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
  .sheet h3{margin:0 0 10px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
  .val{font-size:56px;font-weight:200;letter-spacing:-.02em;text-align:center;padding:6px;min-height:72px}
  .val .u{font-size:18px;color:var(--dim);font-weight:400;margin-left:6px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 12px}
  .pad button{font:inherit;font-size:24px;font-weight:200;padding:16px 0;border:1px solid var(--hair);border-radius:8px;background:transparent;color:var(--bone);cursor:pointer}
  .pad button:active{border-color:var(--magenta);color:var(--magenta)}
  .pad button.soft{color:var(--dim);font-size:18px}
  .row{display:flex;gap:10px}
  .row button{flex:1;font:inherit;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;padding:16px;border-radius:70px;cursor:pointer;
              background:transparent;border:1px solid var(--hair);color:var(--dim)}
  .row .ok{border-color:var(--bone);color:var(--bone)} .row .ok:active{border-color:var(--magenta);color:var(--magenta)}
  textarea{width:100%;font:inherit;font-size:18px;background:var(--void);color:var(--bone);border:1px solid var(--hair);border-radius:8px;padding:14px;min-height:110px;margin-bottom:12px;resize:vertical}
  textarea:focus{outline:2px solid var(--magenta);outline-offset:2px}
  .hint{border:1px solid var(--hair);border-radius:8px;padding:12px 14px;font-size:15px;margin:0 0 12px;line-height:1.45;color:var(--bone);opacity:.9}
  .hint b{color:var(--bone);font-weight:800} .hint .cap{color:var(--magenta);text-transform:none;letter-spacing:0;font-size:inherit}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bone);color:var(--void);padding:10px 18px;border-radius:70px;
         font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1} .toast.err{background:var(--magenta);color:var(--void)}
  footer{margin-top:48px;text-align:center;color:var(--dim);font-size:10px;line-height:2;text-transform:uppercase;letter-spacing:.14em}
  footer a{color:var(--bone);text-decoration:none} footer a:hover{color:var(--magenta)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="glucose stale" id="glucose">
  <span class="num" id="gnum">—</span>
  <span class="arrow" id="garrow"></span>
  <span class="meta" id="gmeta">loading</span>
</div>
<p class="date" id="date"></p>
<div class="strip" id="strip"></div>

<div class="grid">
  <button class="btn" data-kind="basaglar"><span class="t">Basaglar</span><small>long-acting</small></button>
  <button class="btn" data-kind="apidra"><span class="t">Apidra</span><small>with food</small></button>
  <button class="btn" data-kind="carbs"><span class="t">Food</span><small>carbs in grams</small></button>
  <button class="btn" data-kind="bg"><span class="t">Finger prick</span><small>blood test, mmol/L</small></button>
  <button class="btn" data-kind="note"><span class="t">Note</span><small>anything else</small></button>
  <button class="btn" data-kind="activity"><span class="t">Activity</span><small>phys. movement</small></button>
</div>

<h2 id="h-check">Today</h2>
<ul class="check" id="check"></ul>

<h2>Last 7 days</h2>
<div class="tiles" id="week"></div>

<h2>Log</h2>
<ul class="log" id="log"></ul>

<footer>
  T1D Information : <a href="https://t1de.krkt.shop">T1DE.KRKT.SHOP</a><br>
  FOR MY KRKT, MY HUNNY&lt;3 PHR0ZT
</footer>

<div class="veil" id="veil">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const LABEL = { basaglar:"Basaglar", apidra:"Apidra", carbs:"Food", bg:"Finger prick", note:"Note", activity:"Activity" };
const UNIT  = { basaglar:"u", apidra:"u", carbs:"g", bg:"mmol/L" };
const ARROW = { DoubleUp:"⇈", SingleUp:"↑", FortyFiveUp:"↗", Flat:"→", FortyFiveDown:"↘", SingleDown:"↓", DoubleDown:"⇊" };
let defaults = { basaglar: 25 };

async function load(){
  try{
    const r = await fetch("/api/today",{cache:"no-store"});
    if(r.status===401){ location.href="/"; return; }
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    defaults = d.defaults || defaults;
    $("#date").textContent = d.date;

    const g = d.glucose, el = $("#glucose");
    el.className = "glucose";
    if(!g){ el.classList.add("stale"); $("#gnum").textContent="—"; $("#gmeta").textContent="no reading"; }
    else{
      $("#gnum").textContent = g.mmol.toFixed(1);
      $("#garrow").textContent = ARROW[g.direction] || "";
      $("#gmeta").textContent = (g.delta!=null?(g.delta>0?"+":"")+g.delta.toFixed(1)+" · ":"") + (g.ageMin<=1?"just now":g.ageMin+" min ago");
      if(g.ageMin>15) el.classList.add("stale");
      else el.classList.add(g.mmol>=10?"high":g.mmol<4?"low":"ok");
    }

    window.__d = d;
    const b = d.basaglar || {};
    $("#strip").innerHTML =
      `<span class="chip ${b.yesterday?"good":"bad"}">Basaglar yesterday <b>${b.yesterday?"✓":"missed"}</b></span>` +
      `<span class="chip ${b.streak>=3?"good":""}">Streak <b>${b.streak} day${b.streak===1?"":"s"}</b></span>` +
      (d.iob>0 ? `<span class="chip">Insulin active <b>${d.iob}u</b></span>` : "");
    const w = d.week;
    $("#week").innerHTML = w ? `
      <div class="tile"><div class="n" style="color:${w.tir>=50?"var(--ok)":w.tir>=25?"var(--wait)":"var(--red)"}">${w.tir}%</div><div class="l">in range 3.9–10</div></div>
      <div class="tile"><div class="n">${w.avg}</div><div class="l">avg mmol/L</div></div>
      <div class="tile"><div class="n" style="color:${w.basaglarDays>=6?"var(--ok)":"var(--wait)"}">${w.basaglarDays}/7</div><div class="l">Basaglar days</div></div>`
      : `<div class="empty">No glucose data yet.</div>`;
    const allDone = d.checklist.every(c=>c.done);
    $("#h-check").textContent = allDone ? "Today — all done" : "Today";
    $("#check").innerHTML = d.checklist.map(c=>`
      <li class="${c.done?"done":(c.late?"todo late":c.prompt?"todo prompt":"todo")}">
        <span class="mark">${c.done?"✓":""}</span>
        <span class="lbl">${c.label}</span>
        <span class="det">${c.detail}</span>
      </li>`).join("");

    $("#log").innerHTML = d.items.length ? d.items.map(i=>`
      <li><span class="t">${i.time}</span>
          <span>${i.label}${i.value!=null?" "+i.value+i.unit:""}${i.note?" — "+esc(i.note):""}</span>
          <span class="src">${i.source==="page"?"":i.source}</span></li>`).join("")
      : `<li class="empty">Nothing logged yet today.</li>`;
  }catch(e){ toast("Can't reach Nightscout: "+e.message, true); }
}
function esc(s){ return s.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

// ----- popup -----
let kind=null, val="";
document.querySelectorAll(".btn").forEach(b=>b.addEventListener("click",()=>open(b.dataset.kind)));
function open(k){
  kind=k;
  if(k==="note"||k==="activity"){
    const ph = k==="activity" ? "e.g. walked 20 min, stairs, cleaned the house" : "e.g. felt dizzy, skipped lunch, new sensor";
    $("#sheet").innerHTML = `<h3>${LABEL[k]}</h3><textarea id="note" placeholder="${ph}"></textarea>
      <div class="row"><button class="cancel" onclick="close()">Cancel</button><button class="ok" onclick="saveNote()">OK</button></div>`;
    $("#veil").classList.add("open"); $("#note").focus(); return;
  }
  val = k==="basaglar" ? String(defaults.basaglar) : "";
  let hint = "";
  if(k==="apidra" && window.__d){
    const d = window.__d, c = d.correction, lf = d.lastFast;
    const parts = [];
    if(lf) parts.push(`Last dose <b>${lf.value}u</b> ${lf.minsAgo<60?lf.minsAgo+" min":Math.round(lf.minsAgo/60*10)/10+" h"} ago, <b>${d.iob}u</b> still active.`);
    else if(d.iob>0) parts.push(`<b>${d.iob}u</b> still active.`);
    if(c) parts.push(`${d.glucose.mmol} → ${c.target}: about <b>${c.net}u</b> after what's active${c.capped?` <span class="cap">(capped at ${d.maxCorrection}u — recheck in 2 h)</span>`:""}.`);
    if(parts.length) hint = `<div class="hint">${parts.join(" ")}</div>`;
  }
  $("#sheet").innerHTML = `<h3>${k==="bg" ? "Finger prick — reading?" : LABEL[k]+" — how much?"}</h3>${hint}
    <div class="val"><span id="v"></span><span class="u">${UNIT[k]}</span></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join("")}
      <button class="soft" onclick="key('.')">.</button><button onclick="key('0')">0</button><button class="soft" onclick="key('⌫')">⌫</button></div>
    <div class="row"><button class="cancel" onclick="close()">Cancel</button><button class="ok" onclick="save()">OK</button></div>`;
  render(); $("#veil").classList.add("open");
}
function key(c){
  if(c==="⌫") val=val.slice(0,-1);
  else if(c==="." && val.includes(".")) return;
  else if(val.length<5) val+=c;
  render();
}
function render(){ $("#v").textContent = val || "0"; }
function close(){ $("#veil").classList.remove("open"); }
$("#veil").addEventListener("click",e=>{ if(e.target.id==="veil") close(); });

async function save(){
  const n=Number(val); if(!(n>0)) return toast("Enter a number above 0", true);
  await post({kind, value:n});
}
async function saveNote(){
  const t=$("#note").value.trim(); if(!t) return toast("Write something first", true);
  await post({kind, note:t});
}
async function post(body){
  try{
    const r = await fetch("/api/treat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j = await r.json(); if(j.error) throw new Error(j.error);
    close(); toast(`${LABEL[body.kind]} saved`); load();
  }catch(e){ toast("Not saved: "+e.message, true); }
}
let tt; function toast(m,err){ const t=$("#toast"); t.textContent=m; t.className="toast show"+(err?" err":""); clearTimeout(tt); tt=setTimeout(()=>t.className="toast",2600); }

if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
load(); setInterval(load, 60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
